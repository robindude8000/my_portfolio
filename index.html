<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal data engineering portfolio: selected projects, skills, and experience.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Data Engineering Portfolio">
  <meta property="og:description" content="Selected data engineering projects, skills, and experience.">
  <meta name="theme-color" content="#f4f4f2">
  <title>Data Engineering Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=optional" rel="stylesheet">
  <script>
    // Apply the saved preference before painting; storage may be unavailable.
    try {
      const savedTheme = localStorage.getItem('portfolio-theme');
      document.documentElement.dataset.theme = ['light', 'dark'].includes(savedTheme)
        ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  </script>
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="./assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="#home" id="brand"></a><div class="header-controls"><nav aria-label="Main navigation" id="navigation"></nav><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false"><span class="theme-light" aria-hidden="true">Light</span><span class="theme-dark" aria-hidden="true">Dark</span></button></div></div></header>
  <main id="main">
    <p id="load-status" class="load-status">Loading portfolio…</p>
    <noscript><p class="load-status">Enable JavaScript to view this portfolio.</p></noscript>
    <div id="portfolio" hidden>
      <section class="hero" id="home" aria-labelledby="name"><div class="hero-inner"><p class="eyebrow" id="title"></p><h1 id="name"></h1><p class="summary" id="summary"></p></div></section>
      <div class="page-content">
        <section class="content-section" id="projects" aria-labelledby="projects-heading"><div class="section-heading"><p class="eyebrow">01 / Selected work</p><h2 id="projects-heading">Projects</h2></div><div id="project-list"></div></section>
        <section class="content-section" id="skills" aria-labelledby="skills-heading"><div class="section-heading"><p class="eyebrow">02 / Toolkit</p><h2 id="skills-heading">Skills</h2></div><div id="skill-list"></div></section>
        <section class="content-section" id="experience" aria-labelledby="experience-heading"><div class="section-heading"><p class="eyebrow">03 / Background</p><h2 id="experience-heading">Experience</h2></div><div id="experience-list"></div></section>
        <section class="content-section" id="education" aria-labelledby="education-heading"><div class="section-heading"><p class="eyebrow">04 / Learning</p><h2 id="education-heading">Education</h2></div><div id="education-list"></div></section>
        <section class="contact" id="contact" aria-labelledby="contact-heading"><div><p class="eyebrow">05 / Start a conversation</p><h2 id="contact-heading">Get in touch.</h2></div><div class="contact-details"><a id="email" class="email"></a><div id="contact-links"></div></div></section>
        <footer><span id="footer-name"></span><a href="#home">Back to top</a></footer>
      </div>
    </div>
  </main>
</body>
</html>
